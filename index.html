<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои поездки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Верхняя панель (Шапка) -->
    <header class="top-bar">
        <div class="container top-bar-content">
            <div class="logo">Поездки</div>
            <div class="user-profile">
                <span>Заболоцкий К.О</span>
                <button class="logout-btn" aria-label="Выйти">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container">
        
        <!-- Заголовок страницы и кнопка -->
        <div class="page-header">
            <h1>Мои поездки</h1>
            <button class="btn-primary">+ Оформить поездку</button>
        </div>

        <!-- Панель фильтров -->
        <section class="filters-panel">
            <div class="filter-group">
                <label>Период с:</label>
                <div class="input-wrapper">
                    <input type="date" placeholder="Выберите дату">
                </div>
            </div>
            <div class="filter-group">
                <label>по:</label>
                <div class="input-wrapper">
                    <input type="date" placeholder="Выберите дату">
                </div>
            </div>
            <div class="filter-group search-group">
                <label>Поиск:</label>
                <div class="input-wrapper">
                    <input type="text" placeholder="Поиск по городу, номеру...">
                </div>
            </div>
            
            <div class="filter-actions">
                <a href="#" class="reset-link">✕ Сбросить все</a>
                <label class="checkbox-label">
                    <input type="checkbox">
                    <span>Показать архивные поездки</span>
                </label>
            </div>
        </section>

        <!-- Таблица -->
        <section class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>№ поездки</th>
                        <th>Дата поездки</th>
                        <th>Сумма, план</th>
                        <th>Сумма, факт</th>
                        <th>Город</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Данные рендерятся через JS -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
